server {
    listen 80;
    server_name furidance.app ww.furidance.app;
    retun 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name furidance.app www.furidance.app;
    ssl_certificate /etc/letsencrypt/live/furidance.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furidance.app/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}